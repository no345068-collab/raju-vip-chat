<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAJU PERSONAL VIP CHAT</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;padding:0;min-height:100vh;background:#eef2f7;color:#1e293b}
.page{display:none}
#page1.active{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.neu-card{width:100%;max-width:360px;background:#eef2f7;padding:20px;border-radius:24px;box-shadow:10px 10px 20px #c8d0dc,-10px -10px 20px #ffffff}
.neu-lock{width:76px;height:76px;margin:0 auto 14px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;background:#eef2f7;box-shadow:inset 5px 5px 10px #c8d0dc,inset -5px -5px 10px #ffffff;transition:.25s}
.neu-lock.ok{background:#dcfce7;color:#16a34a;box-shadow:0 0 0 2px #86efac}
.auth-sub{font-size:10px;letter-spacing:1.4px;color:#64748b;font-weight:700;text-align:center}
.auth-title{font-size:20px;font-weight:800;color:#0f172a;text-align:center;margin:4px 0 12px}
#lock-status{font-size:12px;color:#475569;text-align:center;margin-bottom:10px;font-weight:600}
#page3.active{display:flex;flex-direction:column;justify-content:space-between;width:100%;min-height:100vh;margin:0;background:#eef2f7;padding:12px}
h1{color:#111;font-size:15px;font-weight:600;margin:2px 0 8px 0;text-transform:lowercase;letter-spacing:.3px}
input{padding:11px;font-size:15px;width:100%;margin-top:8px;border:none;border-radius:12px;background:#eef2f7;color:#000;box-shadow:inset 4px 4px 8px #c8d0dc,inset -4px -4px 8px #ffffff}
input:focus{outline:1px solid #94a3b8}
button{padding:10px 14px;font-size:13px;font-weight:600;margin-top:10px;margin-right:6px;background:#eef2f7;color:#0f172a;border:none;border-radius:12px;box-shadow:4px 4px 8px #c8d0dc,-4px -4px 8px #ffffff;cursor:pointer}
button:active{box-shadow:inset 3px 3px 6px #c8d0dc,inset -3px -3px 6px #ffffff}
.verify-btn{width:100%;margin-right:0}
#chat-list{flex:1;background:#eef2f7;border-radius:10px;padding:10px;min-height:60vh;overflow-y:auto;text-align:left;margin:6px 0;box-shadow:inset 4px 4px 8px #c8d0dc,inset -4px -4px 8px #ffffff}
.msg{background:#e2e8f0;color:#000;padding:8px 10px;border-radius:8px;margin-bottom:8px;word-wrap:break-word}
.msg img,.msg video{width:100%;max-height:360px;object-fit:contain;border-radius:8px;margin-top:6px;display:block}
</style>
</head>
<body>

<div class="page active" id="page1">
<div class="neu-card">
<div class="neu-lock" id="lock-badge">🔐</div>
<div class="auth-sub">AUTHENTICATION</div>
<div class="auth-title">Verify Your Identity</div>
<div id="lock-status">Locked (PIN Protected)</div>
<input type="password" id="pin-in" placeholder="4-digit PIN" maxlength="4">
<button class="verify-btn" onclick="unlockChat()">VERIFY ACCESS</button>
<button onclick="savePin()">Set New PIN</button>
</div>
</div>
<div class="page" id="page3">
<h1>VIP CHAT LIST</h1>
<div id="chat-list"></div>
<input type="text" id="msg" placeholder="Message likhein ya bolen..."><br>
<button onclick="sendMsg()">Send</button>
<button onclick="voice()">Mic</button>
<button onclick="document.getElementById('media-inp').click()">Photo/Video</button>
<input type="file" id="media-inp" accept="image/*,video/*" style="display:none" onchange="sendMedia(this)">
</div>

<script>
var PIN_KEY="raju_pin";
if(!localStorage.getItem(PIN_KEY))localStorage.setItem(PIN_KEY,"5243");
function showPage(id){
  document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active")});
  document.getElementById(id).classList.add("active");
}
function unlockChat(){
  var v=document.getElementById("pin-in").value.trim();
  if(v===localStorage.getItem(PIN_KEY)){
    var b=document.getElementById("lock-badge");
    b.innerText="✓";b.classList.add("ok");
    document.getElementById("lock-status").innerText="Access verified securely";
    setTimeout(function(){b.innerText="🔐";b.classList.remove("ok");showPage("page3");},450);
  }else{alert("Galat PIN! Default: 1234")}
}
function savePin(){
  var v=document.getElementById("pin-in").value.trim();
  if(v.length<4){alert("4-digit PIN daalein");return}
  localStorage.setItem(PIN_KEY,v);
  alert("Naya PIN save ho gaya!");
}
function addMsg(html){
  var d=document.createElement("div");d.className="msg";d.innerHTML=html;
  var b=document.getElementById("chat-list");b.appendChild(d);b.scrollTop=b.scrollHeight;
}
function sendMsg(){
  var i=document.getElementById("msg"),t=i.value.trim();if(!t)return;
  addMsg("<b>Raju:</b> "+t.replace(/</g,"&lt;"));i.value="";
}
function sendMedia(inp){
  var f=inp.files[0];if(!f)return;
  var u=URL.createObjectURL(f);
  if(f.type.startsWith("image/")){addMsg("<b>Raju:</b> Photo<img src='"+u+"'>")}
  else if(f.type.startsWith("video/")){addMsg("<b>Raju:</b> Video<video src='"+u+"' controls></video>")}
  inp.value="";
}
function voice(){
  var S=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!S){alert("Mic support nahi hai");return}
  var r=new S();r.lang="hi-IN";r.onresult=function(e){document.getElementById("msg").value=e.results[0][0].transcript};r.start();
}
</script>

<script>
window.addEventListener("DOMContentLoaded", function() {
  const TARGET_PIN = "5243";
  const btn = document.querySelector(".verify-btn") || Array.from(document.querySelectorAll("button")).find(b => b.innerText.toLowerCase().includes("verify"));
  const inp = document.querySelector("input[type=password], input[type=number], input[type=text]");
  if (btn && inp) {
    inp.type = "password";
    inp.inputMode = "numeric";
    inp.placeholder = "Enter 4-digit PIN";
    btn.onclick = function(e) {
      e.preventDefault();
      e.stopImmediatePropagation();
      const status = document.getElementById("lock-status");
      const badge = document.getElementById("lock-badge");
      if (inp.value.trim() === TARGET_PIN) {
        if (badge) { badge.innerText = "✓"; badge.classList.add("ok"); }
        if (status) status.innerText = "Access verified securely";
        setTimeout(function() {
          if (typeof showPage === "function") showPage("page3");
        }, 450);
      } else {
        if (status) status.innerText = "Wrong PIN! Try again.";
        inp.value = "";
      }
    };
  }
});
</script>


<!-- BOTTOM_ICON_BAR_START -->
<style>
.vip-bottom-bar {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.7);
  box-shadow: 0 10px 28px rgba(15, 23, 42, 0.16);
  z-index: 9999;
}
.vip-msg-input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: rgba(238, 242, 247, 0.9);
  color: #0f172a;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
}
.vip-icon-btn {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.92);
  color: #0f172a;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
}
.vip-send-btn {
  background: #0f172a;
  color: #ffffff;
}
</style>
<script>
(function() {
  function applyVipBar() {
    if (document.querySelector(".vip-bottom-bar")) return;
    const allInputs = Array.from(document.querySelectorAll("input, textarea"));
    let inputEl = allInputs.find(el => {
      const p = (el.placeholder || "").toLowerCase();
      return p.includes("message") || p.includes("likhein") || p.includes("bolen") || p.includes("type");
    });

    const allBtns = Array.from(document.querySelectorAll("button, input[type=button], input[type=submit]"));
    const mediaBtn = allBtns.find(b => {
      const t = ((b.innerText || b.value || "") + " " + (b.id || "") + " " + (b.className || "")).toLowerCase();
      return t.includes("photo") || t.includes("video") || t.includes("media") || t.includes("img");
    });
    const micBtn = allBtns.find(b => {
      const t = ((b.innerText || b.value || "") + " " + (b.id || "") + " " + (b.className || "")).toLowerCase();
      return t.includes("mic") || t.includes("voice") || t.includes("audio");
    });
    const sendBtn = allBtns.find(b => {
      const t = ((b.innerText || b.value || "") + " " + (b.id || "") + " " + (b.className || "")).toLowerCase();
      return t.includes("send") || t.includes("bheje");
    });

    const bar = document.createElement("div");
    bar.className = "vip-bottom-bar";

    if (!inputEl) {
      inputEl = document.createElement("input");
      inputEl.type = "text";
      inputEl.placeholder = "Message likhein ya bolen...";
    }
    inputEl.classList.add("vip-msg-input");
    bar.appendChild(inputEl);

    function makeBtn(existingBtn, icon, extraClass, fallbackAction) {
      const btn = existingBtn || document.createElement("button");
      btn.type = "button";
      btn.className = "vip-icon-btn " + (extraClass || "");
      btn.innerHTML = icon;
      if (!existingBtn && fallbackAction) {
        btn.addEventListener("click", fallbackAction);
      }
      bar.appendChild(btn);
    }

    makeBtn(mediaBtn, "🖼️", "", function() {
      const fileInput = document.querySelector("input[type=file]");
      if (fileInput) fileInput.click();
    });

    makeBtn(micBtn, "🎙️", "", function() {
      inputEl.focus();
    });

    makeBtn(sendBtn, "➤", "vip-send-btn", function() {
      if (inputEl.value.trim()) inputEl.value = "";
    });

    document.body.appendChild(bar);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", applyVipBar);
  } else {
    applyVipBar();
  }
  setTimeout(applyVipBar, 400);
})();
</script>
<!-- BOTTOM_ICON_BAR_END -->
</body>
</html>
